services:
  - type: web
    name: trading-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -e ".[backend]"
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        sync: false
