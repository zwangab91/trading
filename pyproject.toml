[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Conservative low/mid frequency quantitative trading agent scaffold."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
research = [
  "numpy>=1.24",
  "pandas>=1.5",
]
dashboard = [
  "numpy>=1.24",
  "pandas>=1.5",
  "streamlit>=1.50",
  "yfinance>=1.2,<2",
]
test = [
  "pytest>=7",
]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[tool.setuptools.packages.find]
include = ["trading_agent*"]
